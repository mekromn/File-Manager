name: Diagnose file open dispatch

on:
  workflow_dispatch:
  push:
    branches: [stage12-filetype-open-associations]
    paths:
      - '.github/workflows/diagnose-file-open.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode confirmed Stage 11 baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors -o fx.apk 'https://d.apkpure.net/b/APK/nextapp.fx?version=latest'
          echo '19af15780d0fc65242ed3f97d6397adfbb0055225cef84ccbc2c777b906bf2c6  fx.apk' | sha256sum -c -
          curl -fL --retry 4 --retry-all-errors -o apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' | sha256sum -c -
          java -jar apktool.jar d -f fx.apk -o decoded
          while IFS= read -r stage; do python3 "$stage" decoded; done < <(find tools/stages -maxdepth 1 -type f -name 'stage*.py' -print | LC_ALL=C sort)
      - name: Inventory open/MIME/chooser code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diag/full
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          root=Path('decoded')
          pats=[
            'android.intent.action.VIEW','android.intent.action.EDIT','createChooser',
            'setDataAndType','setData(','setType(','resolveActivity','queryIntentActivities',
            'startActivity','startActivityForResult','getMimeTypeFromExtension',
            'MimeTypeMap','application/octet-stream','Open with','open with','OPEN_WITH'
          ]
          out=[]
          candidate_files=[]
          for sd in root.glob('smali*'):
            for p in sd.rglob('*.smali'):
              t=p.read_text(errors='ignore')
              hits=[pat for pat in pats if pat in t]
              if hits:
                candidate_files.append(p)
                lines=t.splitlines()
                out.append(f'===== {p.relative_to(root)} :: {", ".join(hits)} =====')
                for i,line in enumerate(lines):
                  if any(pat in line for pat in pats):
                    lo=max(0,i-12); hi=min(len(lines),i+13)
                    out.extend(f'{j+1:05d}: {lines[j]}' for j in range(lo,hi))
                    out.append('---')
          Path('diag/open-dispatch-context.txt').write_text('\n'.join(out)+'\n')

          # Capture the likely central dispatchers whole so Stage12 can patch structurally.
          wanted=[
            'smali/hf/b0.smali','smali/hf/y0.smali','smali/qe/d.smali',
            'smali/gf/o.smali','smali/ce/i.smali','smali/af/g.smali',
            'smali/ze/a.smali','smali/hh/n.smali'
          ]
          for rel in wanted:
            p=root/rel
            if p.exists():
              dest=Path('diag/full')/(rel.replace('/','__'))
              shutil.copy2(p,dest)

          # Find every call INTO hf/b0 and every construction of that class.
          refs=[]
          for sd in root.glob('smali*'):
            for p in sd.rglob('*.smali'):
              t=p.read_text(errors='ignore')
              if 'Lhf/b0;' in t:
                refs.append(f'===== {p.relative_to(root)} =====\n'+t)
          Path('diag/hf-b0-callers.txt').write_text('\n'.join(refs)+'\n')

          # Resource/menu/string inventory relevant to Open/Open with / file associations.
          rout=[]
          for base in (root/'res', root/'assets'):
            if not base.exists(): continue
            for p in base.rglob('*'):
              if not p.is_file(): continue
              try: t=p.read_text(errors='ignore')
              except Exception: continue
              if re.search(r'(?i)open with|open_as|openas|mime|file type|association|always open|default app',t):
                rout.append(f'===== {p.relative_to(root)} =====\n{t}')
          Path('diag/open-resource-context.txt').write_text('\n'.join(rout)+'\n')
          print(f'open_dispatch_bytes={Path("diag/open-dispatch-context.txt").stat().st_size}')
          print(f'open_resource_bytes={Path("diag/open-resource-context.txt").stat().st_size}')
          print(f'hf_b0_callers_bytes={Path("diag/hf-b0-callers.txt").stat().st_size}')
          PY
          grep -n -E 'android.intent.action.VIEW|createChooser|setDataAndType|queryIntentActivities|resolveActivity|Open with|open with' diag/open-dispatch-context.txt | head -n 240 || true
      - uses: actions/upload-artifact@v4
        with:
          name: file-open-dispatch-diagnostic
          path: diag
          retention-days: 3
