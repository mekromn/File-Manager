name: Diagnose ph.m verifier failure

on:
  workflow_dispatch:
  push:
    branches: [stage11-runtime-repair]
    paths:
      - '.github/workflows/diagnose-phm-verify.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable base and pinned Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors -o fx.apk 'https://d.apkpure.net/b/APK/nextapp.fx?version=latest'
          echo '19af15780d0fc65242ed3f97d6397adfbb0055225cef84ccbc2c777b906bf2c6  fx.apk' | sha256sum -c -
          curl -fL --retry 4 --retry-all-errors -o apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' | sha256sum -c -
          java -jar apktool.jar d -f fx.apk -o decoded
      - name: Replay through Stage07a
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diag
          while IFS= read -r stage; do
            b="$(basename "$stage")"
            [[ "$b" == stage07b_* ]] && break
            python3 "$stage" decoded
          done < <(find tools/stages -maxdepth 1 -type f -name 'stage*.py' -print | LC_ALL=C sort)
          cp decoded/smali/ph/m.smali diag/ph-m-pre07b.smali
          python3 - <<'PY'
          from pathlib import Path
          t=Path('decoded/smali/ph/m.smali').read_text()
          sig='b(Ldw/filemanager/ui/fxsystem/MainPrefActivity;Landroid/preference/PreferenceGroup;)V'
          for line in t.splitlines():
              if line.startswith('.method') and sig in line:
                  decl=line; break
          else: raise RuntimeError('method b declaration not found')
          s=t.index(decl); e=t.index('.end method',s)+len('.end method')
          Path('diag/method-b-pre07b.smali').write_text(t[s:e]+'\n')
          Path('diag/method-b-decl.txt').write_text(decl+'\n')
          PY
      - name: Apply Stage07b and capture method
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stages/stage07b_remove_privacy_surface.py decoded
          cp decoded/smali/ph/m.smali diag/ph-m-post07b.smali
          python3 - <<'PY'
          from pathlib import Path
          t=Path('decoded/smali/ph/m.smali').read_text()
          sig='b(Ldw/filemanager/ui/fxsystem/MainPrefActivity;Landroid/preference/PreferenceGroup;)V'
          for line in t.splitlines():
              if line.startswith('.method') and sig in line:
                  decl=line; break
          else: raise RuntimeError('method b declaration not found post07b')
          s=t.index(decl); e=t.index('.end method',s)+len('.end method')
          Path('diag/method-b-post07b.smali').write_text(t[s:e]+'\n')
          PY
          diff -u diag/method-b-pre07b.smali diag/method-b-post07b.smali | tee diag/method-b-stage07b.diff || true
          grep -n -C 20 'v8' diag/method-b-post07b.smali | tee diag/v8-post-context.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: phm-stage07b-verifier-diagnostic
          path: diag
          retention-days: 3
