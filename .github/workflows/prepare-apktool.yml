name: Prepare Apktool

on:
  push:
    paths:
      - '.github/workflows/prepare-apktool.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' | sha256sum -c -
      - name: Upload tool
        uses: actions/upload-artifact@v4
        with:
          name: apktool-3.0.3
          path: apktool.jar
          retention-days: 1
