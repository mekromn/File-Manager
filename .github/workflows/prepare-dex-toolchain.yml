name: Prepare DEX toolchain

on:
  push:
    paths:
      - '.github/workflows/prepare-dex-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned smali toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o baksmali.jar https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar
          curl -fL --retry 3 -o smali.jar https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar
          echo '37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  baksmali.jar' | sha256sum -c -
          echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  smali.jar' | sha256sum -c -
      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: dex-toolchain-3.0.10
          path: |
            baksmali.jar
            smali.jar
          retention-days: 1
