name: Diagnose Stage19 folder palette

on:
  workflow_dispatch:
  push:
    branches: [stage19-original-folder-palette]
    paths:
      - '.github/workflows/diagnose-stage19-folder-palette.yml'
      - 'tools/stages/stage19*.py'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode confirmed v9109007 baseline and map folder palette UIs
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors -o fx.apk 'https://d.apkpure.net/b/APK/nextapp.fx?version=latest'
          echo '19af15780d0fc65242ed3f97d6397adfbb0055225cef84ccbc2c777b906bf2c6  fx.apk' | sha256sum -c -
          curl -fL --retry 4 --retry-all-errors -o apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' | sha256sum -c -
          java -jar apktool.jar d -f fx.apk -o decoded
          while IFS= read -r stage; do python3 "$stage" decoded; done < <(find tools/stages -maxdepth 1 -type f -name 'stage*.py' -print | LC_ALL=C sort)
          mkdir -p diag/full diag/drawables
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          root=Path('decoded'); sm=root/'smali'; res=root/'res'
          strings=(res/'values/strings.xml').read_text(errors='ignore')
          public=(res/'values/public.xml').read_text(errors='ignore')
          needles=['Dynamic Material','Blue','Copper','Khaki','Green','Plain','Shape','Select Icon','THEME','ICONS']
          names=set()
          for m in re.finditer(r'<string\s+name="([^"]+)"[^>]*>(.*?)</string>',strings,re.S):
              txt=re.sub(r'<.*?>','',m.group(2))
              if any(n.lower() in txt.lower() for n in needles): names.add(m.group(1))
          ids={}
          for name in sorted(names):
              m=re.search(r'<public\s+type="string"\s+name="'+re.escape(name)+r'"\s+id="([^"]+)"',public)
              if m: ids[name]=m.group(1).lower()
          Path('diag/string-ids.txt').write_text('\n'.join(f'{k}={v}' for k,v in ids.items())+'\n')
          cand=[]; chooser=[]; transform=[]
          for sd in root.glob('smali*'):
              for p in sd.rglob('*.smali'):
                  t=p.read_text(errors='ignore'); low=t.lower(); hits=[]
                  for n,rid in ids.items():
                      if rid in low or n in t: hits.append(n)
                  if any(x in low for x in ('selecticon','foldericon','iconstyle','dynamicmaterial','themeicon')): hits.append('name/path')
                  if hits: cand.append((p,hits))
                  if any(x in t for x in ('Ldw/filemanager/ui/widget/c0;','Lkc/a;')): chooser.append(p)
                  if any(x in t for x in ('icon-hue','icon-saturation','"hue"','"saturation"','"brightness"','"lightness"','"value"')):
                      transform.append(p)
          out=[]
          for p,hits in cand:
              out.append(f'===== {p.relative_to(root)} :: {", ".join(hits)} =====\n'+p.read_text(errors='ignore'))
              shutil.copy2(p,Path('diag/full')/(str(p.relative_to(root)).replace('/','__')))
          Path('diag/candidates.txt').write_text('\n'.join(out)+'\n')
          co=[]
          for p in chooser:
              co.append(f'===== {p.relative_to(root)} =====\n'+p.read_text(errors='ignore'))
              shutil.copy2(p,Path('diag/full')/(str(p.relative_to(root)).replace('/','__')))
          Path('diag/iconchooser-callers.txt').write_text('\n'.join(co)+'\n')
          tr=[]
          for p in transform:
              tr.append(f'===== {p.relative_to(root)} =====\n'+p.read_text(errors='ignore'))
              shutil.copy2(p,Path('diag/full')/(str(p.relative_to(root)).replace('/','__')))
          Path('diag/transform-parsers.txt').write_text('\n'.join(tr)+'\n')
          for cls in ('kc/a','dw/filemanager/ui/widget/c0','dw/filemanager/ui/res/ItemIcons','vf/d'):
              p=sm/(cls+'.smali')
              if p.exists(): shutil.copy2(p,Path('diag/full')/(cls.replace('/','__')+'.smali'))
          # Copy the exact tint base / plain folder bitmaps for possible DW-original static light/dark bases.
          for p in res.rglob('*'):
              if p.is_file() and p.name in ('id144_folder.png','id288_folder.png','id144_folder_tintbase.png','id288_folder_tintbase.png'):
                  shutil.copy2(p,Path('diag/drawables')/p.name)
          # Capture all dynamic iconset XML, including tint-folder-color include which earlier keyword pass omitted.
          xml=[]
          for p in (res/'xml').glob('iconset_dynamic*.xml'):
              xml.append(f'===== {p.relative_to(root)} =====\n'+p.read_text(errors='ignore'))
          mod=res/'xml/dw_filemanager_module.xml'
          if mod.exists(): xml.append(f'===== {mod.relative_to(root)} =====\n'+mod.read_text(errors='ignore'))
          Path('diag/dynamic-iconsets.txt').write_text('\n'.join(xml)+'\n')
          print('string_names',sorted(names))
          print('candidate_count',len(cand),'chooser_related',len(chooser),'transform_files',len(transform))
          for p in transform[:80]: print('TRANSFORM',p.relative_to(root))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage19-folder-palette-diagnostic
          path: diag
          retention-days: 3
