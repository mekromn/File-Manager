name: Prepare pinned Uber APK Signer
on:
  push:
    paths:
      - '.github/workflows/prepare-uber-signer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify Uber APK Signer 1.3.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o uber-apk-signer-1.3.0.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          echo 'e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer-1.3.0.jar' | sha256sum -c -
          java -jar uber-apk-signer-1.3.0.jar --help >/dev/null
      - name: Upload tool
        uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer-1.3.0
          path: uber-apk-signer-1.3.0.jar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
