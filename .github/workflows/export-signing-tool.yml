name: Export APK signing tool

# temporary Stage13 signer export trigger
on:
  pull_request:
    paths:
      - '.github/workflows/export-signing-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned uber-apk-signer 1.3.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
            -o uber-apk-signer-1.3.0.jar \
            'https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar'
          echo 'e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer-1.3.0.jar' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: dw-apk-signing-tool
          path: uber-apk-signer-1.3.0.jar
          retention-days: 3
