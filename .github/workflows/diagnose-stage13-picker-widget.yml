name: Diagnose Stage13 picker widget

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-stage13-picker-widget.yml'
      - 'tools/stages/stage12d_internal_file_associations.py'
      - 'tools/stages/stage13*.py'
      - 'tools/stages/stage20*.py'
      - 'tools/stages/stage21*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and capture chooser/home/provider hooks
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors -o fx.apk 'https://d.apkpure.net/b/APK/nextapp.fx?version=latest'
          echo '19af15780d0fc65242ed3f97d6397adfbb0055225cef84ccbc2c777b906bf2c6  fx.apk' | sha256sum -c -
          curl -fL --retry 4 --retry-all-errors -o apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' | sha256sum -c -
          java -jar apktool.jar d -f fx.apk -o decoded
          while IFS= read -r stage; do python3 "$stage" decoded; done < <(find tools/stages -maxdepth 1 -type f -name 'stage*.py' -print | LC_ALL=C sort)
          mkdir -p diag/full
          cp decoded/AndroidManifest.xml diag/AndroidManifest.xml
          cp decoded/res/values/strings.xml diag/strings.xml
          cp decoded/res/values/public.xml diag/public.xml
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          root=Path('decoded'); sm=root/'smali'; res=root/'res'
          strings=(res/'values/strings.xml').read_text(errors='ignore')
          public=(res/'values/public.xml').read_text(errors='ignore')
          wanted=['BOOKMARKS','FILES','Main Storage','System','Documents','Download','DISPLAY AS','SORT BY','Name','Date','Kind','Size','File Chooser']
          names={}
          for m in re.finditer(r'<string\s+name="([^"]+)"[^>]*>(.*?)</string>',strings,re.S):
            txt=re.sub(r'<.*?>','',m.group(2)).strip()
            if txt in wanted or any(x.lower()==txt.lower() for x in wanted): names[m.group(1)]=txt
          ids={}
          for n,txt in names.items():
            m=re.search(r'<public\s+type="string"\s+name="'+re.escape(n)+r'"\s+id="([^"]+)"',public)
            if m: ids[n]=(m.group(1).lower(),txt)
          Path('diag/string-ids.txt').write_text('\n'.join(f'{n}={rid} :: {txt}' for n,(rid,txt) in ids.items())+'\n')

          seeds=['eg/g','nf/a','dw/filemanager/ui/filechooser/ChooserActivity','kh/p','kh/o','hf/j0','hf/g0','be/j','gf/o','af/k','af/j','lf/p','lf/s','lf/r','dw/filemanager/ui/content/k','yg/r','yg/q','yg/p','yg/s']
          copied=set(); queue=list(seeds)
          prefixes=('eg/','nf/','kh/','hf/','be/','gf/','af/','lf/','yg/','dw/filemanager/')
          for _ in range(5):
            nextq=[]
            for cls in queue:
              if cls in copied: continue
              p=sm/(cls+'.smali')
              if not p.exists(): continue
              copied.add(cls); shutil.copy2(p,Path('diag/full')/(cls.replace('/','__')+'.smali'))
              t=p.read_text(errors='ignore')
              for ref in re.findall(r'L([A-Za-z0-9_$/]+);',t):
                if ref.startswith(('java/','android/','androidx/','kotlin/')): continue
                if ref.startswith(prefixes): nextq.append(ref)
            queue=nextq

          needles=[rid for rid,_ in ids.values()] + list(ids.keys()) + [
            'action_sort_name','action_calendar','action_kind','action_size','Laf/k;','Lyg/q;','Lyg/r;',
            'DocumentsProvider','android.provider.DocumentsProvider','android.content.action.DOCUMENTS_PROVIDER',
            'android.intent.action.GET_CONTENT','android.intent.action.OPEN_DOCUMENT','android.intent.action.OPEN_DOCUMENT_TREE',
            'MANAGE_EXTERNAL_STORAGE','requestLegacyExternalStorage','MANAGE_DOCUMENTS','ACTION_GET_CONTENT'
          ]
          hits=[]
          for p in sm.rglob('*.smali'):
            t=p.read_text(errors='ignore')
            mh=[n for n in needles if n in t]
            if mh: hits.append(f'===== {p.relative_to(root)} :: {", ".join(mh[:20])} =====\n'+t)
          Path('diag/hits.txt').write_text('\n\n'.join(hits)+'\n')
          print('captured',len(copied),sorted(copied))
          print('ids',ids)
          print('hits',len(hits))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage13-picker-widget-diagnostic
          path: diag
          retention-days: 3
