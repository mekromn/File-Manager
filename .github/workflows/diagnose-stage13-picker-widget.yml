name: Diagnose Stage13 picker widget

on:
  workflow_dispatch:
  push:
    branches: [stage13-picker-sorting]
    paths:
      - '.github/workflows/diagnose-stage13-picker-widget.yml'
      - 'tools/stages/stage12d_internal_file_associations.py'
      - 'tools/stages/stage13*.py'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and capture chooser widget sort hooks
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors -o fx.apk 'https://d.apkpure.net/b/APK/nextapp.fx?version=latest'
          echo '19af15780d0fc65242ed3f97d6397adfbb0055225cef84ccbc2c777b906bf2c6  fx.apk' | sha256sum -c -
          curl -fL --retry 4 --retry-all-errors -o apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' | sha256sum -c -
          java -jar apktool.jar d -f fx.apk -o decoded
          while IFS= read -r stage; do python3 "$stage" decoded; done < <(find tools/stages -maxdepth 1 -type f -name 'stage*.py' -print | LC_ALL=C sort)
          mkdir -p diag/full
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          root=Path('decoded'); sm=root/'smali'
          seeds=['eg/g','nf/a','dw/filemanager/ui/filechooser/ChooserActivity','kh/p','kh/o','af/k','af/j','lf/p','lf/s','lf/r','dw/filemanager/ui/content/k']
          copied=set(); queue=list(seeds)
          for _ in range(3):
            nextq=[]
            for cls in queue:
              if cls in copied: continue
              p=sm/(cls+'.smali')
              if not p.exists(): continue
              copied.add(cls); shutil.copy2(p,Path('diag/full')/(cls.replace('/','__')+'.smali'))
              t=p.read_text(errors='ignore')
              for ref in re.findall(r'L([A-Za-z0-9_$/]+);',t):
                if ref.startswith(('java/','android/','androidx/','kotlin/')): continue
                if ref.startswith(('eg/','nf/','kh/','af/','lf/','dw/filemanager/ui/content/')): nextq.append(ref)
            queue=nextq
          hits=[]
          for p in sm.rglob('*.smali'):
            t=p.read_text(errors='ignore')
            if 'Leg/g;->' in t or 'Lkh/p;->' in t or 'Lkh/o;->' in t:
              if any(x in t for x in ('Leg/g;->','Lkh/p;->a:Z','Lkh/p;->b:Lkh/o;','setSort','sort')):
                hits.append(f'===== {p.relative_to(sm)} =====\n'+t)
          Path('diag/sort-hits.txt').write_text('\n'.join(hits)+'\n')
          print('captured',len(copied),sorted(copied))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage13-picker-widget-diagnostic
          path: diag
          retention-days: 3
