name: Diagnose Stage19 aapt2 crash

on:
  workflow_dispatch:
  push:
    branches: [stage19-original-folder-palette]
    paths:
      - '.github/workflows/diagnose-stage19-aapt2.yml'
      - 'tools/stages/stage19*.py'
      - 'assets/folder-palette/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and replay Stage19
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors -o fx.apk 'https://d.apkpure.net/b/APK/nextapp.fx?version=latest'
          echo '19af15780d0fc65242ed3f97d6397adfbb0055225cef84ccbc2c777b906bf2c6  fx.apk' | sha256sum -c -
          curl -fL --retry 4 --retry-all-errors -o apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' | sha256sum -c -
          java -jar apktool.jar d -f fx.apk -o decoded
          while IFS= read -r stage; do python3 "$stage" decoded; done < <(find tools/stages -maxdepth 1 -type f -name 'stage*.py' -print | LC_ALL=C sort)

      - name: Compile Stage19 resources individually
        shell: bash
        run: |
          set -u
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          echo "AAPT2=$AAPT2"
          "$AAPT2" version || true
          mkdir -p /tmp/aapt-out diag
          : > diag/aapt-individual.txt
          files=(
            decoded/res/drawable-nodpi/id144_folder_dw_dark_blue.png
            decoded/res/drawable-nodpi/id288_folder_dw_dark_blue.png
            decoded/res/drawable-nodpi/id144_folder_dw_white.png
            decoded/res/drawable-nodpi/id288_folder_dw_white.png
            decoded/res/xml/dw_filemanager_module.xml
            decoded/res/xml/iconset_dynamic_colorfolders.xml
            decoded/res/xml/iconset_dynamic_base_tintfoldercolor.xml
            decoded/res/xml/iconset_dynamic_base_tintfoldercolor_dark_blue.xml
            decoded/res/xml/iconset_dynamic_base_tintfoldercolor_white.xml
            decoded/res/xml/iconset_dynamic_aqua.xml
            decoded/res/xml/iconset_dynamic_dark_blue.xml
            decoded/res/xml/iconset_dynamic_gray.xml
            decoded/res/xml/iconset_dynamic_yellow.xml
            decoded/res/xml/iconset_dynamic_orange.xml
            decoded/res/xml/iconset_dynamic_red.xml
            decoded/res/xml/iconset_dynamic_pink.xml
            decoded/res/xml/iconset_dynamic_violet.xml
            decoded/res/xml/iconset_dynamic_white.xml
            decoded/res/xml/iconset_dynamic_blue.xml
            decoded/res/xml/iconset_dynamic_copper.xml
            decoded/res/xml/iconset_dynamic_khaki.xml
            decoded/res/xml/iconset_dynamic_green.xml
            decoded/res/xml/iconset_dynamic_plain.xml
            decoded/res/values/strings.xml
          )
          for f in "${files[@]}"; do
            echo "===== $f =====" | tee -a diag/aapt-individual.txt
            rm -rf /tmp/aapt-out/*
            set +e
            "$AAPT2" compile --legacy -o /tmp/aapt-out "$f" >>diag/aapt-individual.txt 2>&1
            rc=$?
            set -e
            echo "rc=$rc" | tee -a diag/aapt-individual.txt
          done
          echo '===== FULL DIRECTORY VERBOSE =====' | tee -a diag/aapt-individual.txt
          set +e
          "$AAPT2" compile -v --legacy --dir decoded/res -o /tmp/all-res.zip >>diag/aapt-individual.txt 2>&1
          rc=$?
          set -e
          echo "full_rc=$rc" | tee -a diag/aapt-individual.txt
          tail -n 250 diag/aapt-individual.txt

      - uses: actions/upload-artifact@v4
        with:
          name: stage19-aapt2-diagnostic
          path: diag
          retention-days: 3
